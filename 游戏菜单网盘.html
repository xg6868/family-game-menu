<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>游戏菜单网盘</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0a0a1a 100%);
    font-family: 'Microsoft YaHei', sans-serif;
    min-height: 100vh;
    padding: 20px;
    color: #fff;
}
.header { text-align: center; margin-bottom: 30px; }
.header h1 {
    font-size: 32px;
    background: linear-gradient(90deg, #ff33aa, #aa55ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
}
.header p { color: rgba(255,255,255,0.5); font-size: 14px; }
.upload-area {
    max-width: 800px; margin: 0 auto 30px;
    background: rgba(255,255,255,0.05);
    border: 2px dashed rgba(255,51,170,0.5);
    border-radius: 16px; padding: 40px;
    text-align: center; cursor: pointer; transition: all 0.3s;
}
.upload-area:hover { border-color: #ff33aa; background: rgba(255,51,170,0.1); }
.upload-area .icon { font-size: 48px; margin-bottom: 16px; }
.upload-area p { color: rgba(255,255,255,0.6); font-size: 14px; }
.upload-area input { display: none; }
.progress-container {
    max-width: 800px; margin: 0 auto 30px; display: none;
}
.progress-bar-wrap {
    background: rgba(0,0,0,0.4);
    border: 1px solid rgba(255,51,170,0.4);
    border-radius: 10px; padding: 16px;
}
.progress-text {
    font-size: 13px; color: #ff77c9; margin-bottom: 10px;
    display: flex; justify-content: space-between;
}
.progress-bar {
    height: 20px; background: rgba(0,0,0,0.5);
    border-radius: 10px; overflow: hidden;
    position: relative;
}
.progress-fill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #ff33aa, #aa55ff);
    border-radius: 10px; transition: width 0.3s;
    position: relative;
}
.progress-fill::after {
    content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
    animation: shimmer 1.5s infinite;
}
@keyframes shimmer {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
}
.file-list { max-width: 800px; margin: 0 auto; }
.file-item {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,51,170,0.3);
    border-radius: 12px; padding: 16px; margin-bottom: 12px;
    display: flex; align-items: center; gap: 16px; transition: all 0.3s;
}
.file-item:hover { border-color: #ff33aa; transform: translateX(4px); }
.file-icon {
    width: 48px; height: 48px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px; flex-shrink: 0;
}
.file-icon.exe { background: linear-gradient(135deg, #ff6b6b, #ee5a24); }
.file-icon.png { background: linear-gradient(135deg, #4ecdc4, #44a08d); }
.file-icon.zip { background: linear-gradient(135deg, #f7b731, #fa8231); }
.file-icon.txt { background: linear-gradient(135deg, #a55eea, #8854d0); }
.file-icon.html { background: linear-gradient(135deg, #20bf6b, #0fb9b1); }
.file-info { flex: 1; min-width: 0; }
.file-name { font-size: 15px; font-weight: bold; margin-bottom: 4px; word-break: break-all; }
.file-meta { font-size: 12px; color: rgba(255,255,255,0.5); }
.file-actions { display: flex; gap: 8px; flex-shrink: 0; }
.btn {
    padding: 8px 16px; border: none; border-radius: 8px;
    cursor: pointer; font-size: 13px; transition: all 0.2s;
    text-decoration: none; display: inline-block;
}
.btn-download { background: linear-gradient(90deg, #ff33aa, #aa55ff); color: #fff; }
.btn-download:hover { transform: translateY(-2px); box-shadow: 0 4px 12px rgba(255,51,170,0.4); }
.btn-delete { background: rgba(255,0,0,0.2); color: #ff6b6b; }
.btn-delete:hover { background: rgba(255,0,0,0.4); }
.empty { text-align: center; color: rgba(255,255,255,0.3); padding: 60px; font-size: 14px; }
.link-box {
    background: rgba(0,0,0,0.3); border: 1px solid rgba(255,51,170,0.3);
    border-radius: 8px; padding: 8px 12px; margin-top: 8px;
    font-size: 11px; color: #7ee7ff; word-break: break-all; font-family: Consolas, monospace;
}
.toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
    background: linear-gradient(90deg, #ff33aa, #aa55ff); color: #fff;
    padding: 12px 24px; border-radius: 8px; font-size: 14px;
    z-index: 1000; display: none;
}
.storage-info {
    max-width: 800px; margin: 20px auto; text-align: center;
    font-size: 12px; color: rgba(255,255,255,0.4);
}
</style>
</head>
<body>

<div class="header">
    <h1>☁️ 游戏菜单网盘</h1>
    <p>无需服务器 · 永久保存 · 支持大文件（最大500MB） · 自动生成下载链接</p>
</div>

<div class="upload-area" id="uploadArea" onclick="if(canUpload) document.getElementById('fileInput').click()">
    <div class="icon">📁</div>
    <p id="uploadTip">点击选择文件上传（支持exe、图片、压缩包等大文件）</p>
    <input type="file" id="fileInput" onchange="handleUpload(this)">
</div>

<div class="progress-container" id="progressContainer">
    <div class="progress-bar-wrap">
        <div class="progress-text">
            <span id="progressFileName">上传中...</span>
            <span id="progressPercent">0%</span>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>
    </div>
</div>

<div class="storage-info" id="storageInfo"></div>

<div class="file-list" id="fileList">
    <div class="empty">加载中...</div>
</div>

<div class="toast" id="toast"></div>

<script>
// 用IndexedDB存储大文件（支持500MB+）
let db;
const DB_NAME = 'GameMenuCloudDB';
const STORE_NAME = 'files';

// 后台设置
let canUpload = true;
let canDownload = true;
let canShowList = true;

function loadSettings() {
    try {
        const s = JSON.parse(localStorage.getItem('cloudSettings')) || {};
        canUpload = s.uploadEnabled !== false;
        canDownload = s.downloadEnabled !== false;
        canShowList = s.showList !== false;
    } catch {}
    
    // 根据设置显示/隐藏上传区
    const uploadArea = document.getElementById('uploadArea');
    const uploadTip = document.getElementById('uploadTip');
    if (!canUpload) {
        uploadArea.style.display = 'none';
    }
}

function initDB() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, 1);
        request.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(STORE_NAME)) {
                db.createObjectStore(STORE_NAME, { keyPath: 'id' });
            }
        };
        request.onsuccess = (e) => { db = e.target.result; resolve(); };
        request.onerror = (e) => reject(e);
    });
}

function saveFile(fileData) {
    return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        store.put(fileData);
        tx.oncomplete = () => resolve();
        tx.onerror = (e) => reject(e);
    });
}

function getAllFiles() {
    return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const store = tx.objectStore(STORE_NAME);
        const request = store.getAll();
        request.onsuccess = () => resolve(request.result || []);
        request.onerror = (e) => reject(e);
    });
}

function deleteFileDB(id) {
    return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        store.delete(id);
        tx.oncomplete = () => resolve();
        tx.onerror = (e) => reject(e);
    });
}

function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes/1024).toFixed(1) + ' KB';
    if (bytes < 1073741824) return (bytes/1048576).toFixed(1) + ' MB';
    return (bytes/1073741824).toFixed(2) + ' GB';
}

function getFileExt(name) {
    return name.split('.').pop().toLowerCase();
}

function getFileIcon(ext) {
    const icons = {
        'exe': '⚙️', 'png': '🖼️', 'jpg': '🖼️', 'jpeg': '🖼️',
        'zip': '🗜️', 'rar': '🗜️', 'txt': '📄', 'html': '🌐',
        'pdf': '📕', 'doc': '📘', 'mp4': '🎬', 'mp3': '🎵'
    };
    return icons[ext] || '📄';
}

function getFileIconClass(ext) {
    if (['exe'].includes(ext)) return 'exe';
    if (['png','jpg','jpeg','gif'].includes(ext)) return 'png';
    if (['zip','rar','7z'].includes(ext)) return 'zip';
    if (['html','htm'].includes(ext)) return 'html';
    return 'txt';
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2000);
}

async function handleUpload(input) {
    const file = input.files[0];
    if (!file) return;
    
    // 显示进度条
    const container = document.getElementById('progressContainer');
    const fill = document.getElementById('progressFill');
    const fileNameEl = document.getElementById('progressFileName');
    const percentEl = document.getElementById('progressPercent');
    container.style.display = 'block';
    fileNameEl.textContent = '上传: ' + file.name;
    percentEl.textContent = '0%';
    fill.style.width = '0%';
    
    // 用FileReader读取文件，带进度
    const reader = new FileReader();
    
    reader.onprogress = (e) => {
        if (e.lengthComputable) {
            const percent = Math.round((e.loaded / e.total) * 100);
            fill.style.width = percent + '%';
            percentEl.textContent = percent + '%';
            fileNameEl.textContent = '上传: ' + file.name + ' (' + formatSize(e.loaded) + '/' + formatSize(e.total) + ')';
        }
    };
    
    reader.onload = async (e) => {
        const fileData = {
            id: Date.now(),
            name: file.name,
            size: file.size,
            type: file.type,
            ext: getFileExt(file.name),
            uploadTime: new Date().toLocaleString(),
            blob: file
        };
        
        try {
            await saveFile(fileData);
            await renderFiles();
            showToast('上传成功：' + file.name);
            // 隐藏进度条
            setTimeout(() => { container.style.display = 'none'; }, 1500);
        } catch (err) {
            showToast('上传失败：' + err.message);
        }
    };
    
    reader.onerror = () => {
        showToast('上传失败：读取文件出错');
        container.style.display = 'none';
    };
    
    reader.readAsArrayBuffer(file);
    input.value = '';
}

async function renderFiles() {
    const files = await getAllFiles();
    const list = document.getElementById('fileList');
    const info = document.getElementById('storageInfo');
    
    // 如果关闭了文件列表显示
    if (!canShowList) {
        list.innerHTML = '<div class="empty">文件列表已关闭</div>';
        info.textContent = '';
        return;
    }
    
    if (files.length === 0) {
        list.innerHTML = '<div class="empty">还没有上传文件，点击上方上传</div>';
        info.textContent = '';
        return;
    }
    
    // 计算总大小
    const totalSize = files.reduce((sum, f) => sum + f.size, 0);
    info.textContent = `共 ${files.length} 个文件 · 总大小 ${formatSize(totalSize)}`;
    
    list.innerHTML = files.map(f => {
        const url = URL.createObjectURL(f.blob);
        const downloadBtn = canDownload 
            ? `<a class="btn btn-download" href="${url}" download="${f.name}">⬇ 下载</a>`
            : '';
        return `
        <div class="file-item">
            <div class="file-icon ${getFileIconClass(f.ext)}">${getFileIcon(f.ext)}</div>
            <div class="file-info">
                <div class="file-name">${f.name}</div>
                <div class="file-meta">${formatSize(f.size)} · ${f.uploadTime}</div>
                <div class="link-box">🔗 链接: ${location.origin}${location.pathname}?file=${f.id}</div>
            </div>
            <div class="file-actions">
                ${downloadBtn}
                <button class="btn btn-delete" onclick="deleteFile(${f.id})">🗑 删除</button>
            </div>
        </div>
        `;
    }).join('');
}

async function deleteFile(id) {
    if (!confirm('确定删除这个文件吗？')) return;
    await deleteFileDB(id);
    await renderFiles();
    showToast('已删除');
}

async function checkDownloadLink() {
    const params = new URLSearchParams(location.search);
    const fileId = params.get('file');
    if (fileId) {
        const files = await getAllFiles();
        const file = files.find(f => f.id == fileId);
        if (file) {
            setTimeout(() => {
                const url = URL.createObjectURL(file.blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = file.name;
                a.click();
                showToast('开始下载：' + file.name);
            }, 500);
        }
    }
}

// 初始化
loadSettings();
initDB().then(() => {
    renderFiles();
    checkDownloadLink();
});
</script>

</body>
</html>
